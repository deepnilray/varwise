name: Train ZTF asteroid alert baseline (real images)
on:
  push:
    branches:
      - research/asteroid-training-2026
    paths:
      - research/asteroid-hunter/**
      - .github/workflows/train_asteroid_alerts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.15.3 scikit-learn==1.6.1 pillow==11.2.1 'huggingface_hub>=1.2,<2' hf_xet
      - name: Train on real ZTF / ALeRCE image montages with rate-limit-aware download
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/asteroid-hunter/train_ztf_alerts.py')
          s=p.read_text().replace("local_dir='ztf_alert_data'))", "local_dir='ztf_alert_data',max_workers=2))")
          assert 'max_workers=2' in s
          p.write_text(s)
          PY
          python research/asteroid-hunter/train_ztf_alerts.py
      - name: Upload weights and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztf-alert-real-data-baseline
          path: asteroid_train_results/
          if-no-files-found: warn
