name: VIRAC2 audited engine — software validation
on:
  push:
    paths:
      - 'research/virac2-infrared-discovery-engine/**'
      - '.github/workflows/virac2_engine_audit.yml'
  pull_request:
    paths:
      - 'research/virac2-infrared-discovery-engine/**'
      - '.github/workflows/virac2_engine_audit.yml'
jobs:
  software-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/virac2-infrared-discovery-engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/virac2-infrared-discovery-engine/requirements.txt
      - name: Unit and archived integrity tests
        working-directory: research/virac2-infrared-discovery-engine
        run: |
          python -m unittest discover -s tests -v
          python verify_bundle.py
          python engine.py info
          sha256sum -c SHA256SUMS.txt
      - name: Score known controls (NOT a discovery evaluation)
        working-directory: research/virac2-infrared-discovery-engine
        run: |
          python engine.py score --input examples/known_training_lightcurves.csv --out /tmp/virac2_ci_controls
          python -c "import json; from pathlib import Path; d=json.loads(Path('/tmp/virac2_ci_controls/summary.json').read_text()); print(d); assert d.get('confirmed_discoveries',0)==0"
